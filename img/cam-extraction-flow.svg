<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" role="img" aria-labelledby="title desc">
  <title id="title">How TorchCAM extracts a class activation map</title>
  <desc id="desc">An input passes through a model. A hook stores spatial activations at the target layer, class_idx selects a model score, and gradient-based methods optionally backpropagate that score to capture gradients. The extractor combines these signals into a class activation map, then removes its hooks when the context manager exits.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #262931;
      --muted: #5b6470;
      --line: #87919e;
      --surface: #f3f5f7;
      --surface-strong: #ffffff;
      --brand: #850040;
      --brand-soft: #f7e8ef;
      --accent: #007784;
      --accent-soft: #e2f4f5;
      --danger: #b42318;
      --danger-soft: #feeeec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f2f4f7;
        --muted: #c2c8d0;
        --line: #707987;
        --surface: #252a32;
        --surface-strong: #1c2026;
        --brand: #ff8ab9;
        --brand-soft: #472536;
        --accent: #69d7e2;
        --accent-soft: #183b40;
        --danger: #ff938a;
        --danger-soft: #482724;
      }
    }
    text { fill: #262931; fill: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 650; }
    .small { fill: #5b6470; fill: var(--muted); font-size: 16px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; }
    .panel { fill: #f3f5f7; fill: var(--surface); stroke: #87919e; stroke: var(--line); stroke-width: 1.5; }
    .panel-strong { fill: #ffffff; fill: var(--surface-strong); stroke: #87919e; stroke: var(--line); stroke-width: 1.5; }
    .brand-panel { fill: #f7e8ef; fill: var(--brand-soft); stroke: #850040; stroke: var(--brand); stroke-width: 2; }
    .accent-panel { fill: #e2f4f5; fill: var(--accent-soft); stroke: #007784; stroke: var(--accent); stroke-width: 2; }
    .danger-panel { fill: #feeeec; fill: var(--danger-soft); stroke: #b42318; stroke: var(--danger); stroke-width: 1.5; }
    .arrow { fill: none; stroke: #87919e; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
    .accent-arrow { fill: none; stroke: #007784; stroke: var(--accent); stroke-width: 2.6; marker-end: url(#arrow-accent); }
    .gradient-arrow { fill: none; stroke: #850040; stroke: var(--brand); stroke-width: 2.6; stroke-dasharray: 7 6; marker-end: url(#arrow-brand); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#87919e;fill:var(--line)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#007784;fill:var(--accent)"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#850040;fill:var(--brand)"/>
    </marker>
  </defs>

  <text class="title" x="20" y="38">How a CAM is extracted</text>
  <text class="small" x="20" y="65">Solid: forward data · dotted: gradient-based methods only</text>

  <rect class="panel-strong" x="20" y="112" width="105" height="92" rx="10"/>
  <text class="label" x="72.5" y="145" text-anchor="middle">Input</text>
  <rect x="45" y="160" width="55" height="25" rx="4" style="fill:#e2f4f5;fill:var(--accent-soft);stroke:#007784;stroke:var(--accent)" stroke-width="1.5"/>
  <circle cx="62" cy="172.5" r="6" style="fill:#007784;fill:var(--accent)"/>
  <path d="M72 184 L84 168 L98 184" style="fill:#f7e8ef;fill:var(--brand-soft);stroke:#850040;stroke:var(--brand)" stroke-width="1.5"/>

  <path class="arrow" d="M125 158 H151"/>

  <rect class="panel" x="152" y="91" width="298" height="155" rx="10"/>
  <text class="label" x="171" y="122">Model forward</text>
  <rect class="panel-strong" x="173" y="145" width="72" height="55" rx="7"/>
  <text class="small" x="209" y="178" text-anchor="middle">layers</text>
  <path class="arrow" d="M245 172.5 H265"/>
  <rect class="accent-panel" x="267" y="139" width="104" height="67" rx="7"/>
  <text class="mono" x="319" y="167" text-anchor="middle" style="font-size:15px">target_layer</text>
  <text class="small" x="319" y="191" text-anchor="middle">spatial tensor</text>
  <path class="arrow" d="M371 172.5 H391"/>
  <rect class="panel-strong" x="393" y="145" width="40" height="55" rx="7"/>
  <text class="small" x="413" y="167" text-anchor="middle">pool</text>
  <text class="small" x="413" y="187" text-anchor="middle">+ head</text>

  <path class="arrow" d="M450 158 H478"/>
  <rect class="panel-strong" x="480" y="112" width="140" height="92" rx="10"/>
  <text class="label" x="550" y="145" text-anchor="middle">Logits</text>
  <text class="mono" x="550" y="178" text-anchor="middle">(N, classes)</text>

  <path class="accent-arrow" d="M319 206 V286"/>
  <rect class="accent-panel" x="170" y="288" width="205" height="78" rx="10"/>
  <text class="label" x="272.5" y="320" text-anchor="middle">Stored activations</text>
  <text class="mono" x="272.5" y="348" text-anchor="middle">(N, C, H, W)</text>

  <path class="arrow" d="M550 204 V267"/>
  <rect class="brand-panel" x="430" y="269" width="190" height="97" rx="10"/>
  <text class="mono" x="525" y="302" text-anchor="middle">class_idx</text>
  <text class="label" x="525" y="330" text-anchor="middle">Selected score</text>
  <text class="small" x="525" y="353" text-anchor="middle">the class to explain</text>

  <path class="gradient-arrow" d="M430 332 H405 V430 H375"/>
  <text class="small" x="391" y="395" text-anchor="end">backward</text>
  <rect class="danger-panel" x="430" y="404" width="190" height="42" rx="8"/>
  <text x="525" y="431" text-anchor="middle" style="fill:#b42318;fill:var(--danger);font-size:16px;font-weight:650">× no_grad() blocks it</text>

  <rect class="brand-panel" x="170" y="417" width="205" height="78" rx="10"/>
  <text class="label" x="272.5" y="449" text-anchor="middle">Stored gradients</text>
  <text class="small" x="272.5" y="477" text-anchor="middle">gradient methods only</text>

  <path class="accent-arrow" d="M272.5 366 V390 H145 V558 H329"/>
  <path class="gradient-arrow" d="M375 456 H398 V510"/>
  <path class="arrow" d="M525 366 V385 H630 V492 H470 V510"/>

  <rect class="panel-strong" x="330" y="512" width="184" height="92" rx="10"/>
  <text class="label" x="422" y="546" text-anchor="middle">CAM extractor</text>
  <text class="small" x="422" y="572" text-anchor="middle">method-specific weighting</text>
  <text class="small" x="422" y="594" text-anchor="middle">and spatial aggregation</text>

  <path class="accent-arrow" d="M514 558 H538"/>
  <rect class="accent-panel" x="540" y="512" width="80" height="92" rx="10"/>
  <text class="label" x="580" y="546" text-anchor="middle">CAM</text>
  <rect x="558" y="564" width="44" height="24" rx="4" style="fill:#850040;fill:var(--brand)" opacity=".78"/>
  <rect x="566" y="568" width="28" height="16" rx="3" style="fill:#007784;fill:var(--accent)" opacity=".9"/>

  <path d="M153 633 V650 H620 V633" fill="none" style="stroke:#87919e;stroke:var(--line)" stroke-width="1.8"/>
  <text class="small" x="386.5" y="676" text-anchor="middle">context manager: register hooks before forward · remove hooks on exit</text>
</svg>
