version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "ci(github)"
    schedule:
      interval: "monthly"
      time: "08:00"
    groups:
      actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "daily"
      time: "08:00"
    # Only quality receives routine Python updates. These filters leave security jobs eligible.
    ignore:
      - dependency-name: "uv-build"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "torch"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "torchvision"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "numpy"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "Pillow"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "matplotlib"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pytest*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "mkdocs*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "griffe*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pymdown-extensions"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "streamlit"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "transformers"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "laya"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      quality:
        applies-to: "version-updates"
        patterns:
          - "lint-my-headers"
          - "ruff"
          - "ty"
          - "prek"
      quality-security:
        applies-to: "security-updates"
        patterns:
          - "lint-my-headers"
          - "ruff"
          - "ty"
          - "prek"
      build-security:
        applies-to: "security-updates"
        patterns:
          - "uv-build"
      docs-security:
        applies-to: "security-updates"
        patterns:
          - "mkdocs*"
          - "griffe*"
          - "pymdown-extensions"
      tests-security:
        applies-to: "security-updates"
        patterns:
          - "pytest*"
      runtime-security:
        applies-to: "security-updates"
        patterns:
          - "torch"
          - "torchvision"
          - "numpy"
          - "Pillow"
          - "matplotlib"
      demo-security:
        applies-to: "security-updates"
        patterns:
          - "streamlit"
          - "transformers"
          - "laya"
      other-security:
        applies-to: "security-updates"
        patterns:
          - "*"
