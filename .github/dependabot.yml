# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "ci(github)"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    # Raise these minimums only for security fixes or required library features.
    # Update-type ignores apply to version updates; security updates remain eligible.
    ignore:
      - dependency-name: "torch"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "torchvision"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "matplotlib"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "daily"
      time: "08:00"
    groups:
      docs:
        patterns:
          - "mkdocs*"
          - "griffe*"
      quality:
        patterns:
          - "ruff"
          - "ty"
          - "prek"
          - "uv-build"
      tests:
        patterns:
          - "pytest"
          - "pytest-cov"
          - "pytest-pretty"
      runtime:
        patterns:
          - "torch"
          - "torchvision"
          - "Pillow"
          - "numpy"
      demo:
        patterns:
          - "streamlit"
          - "transformers"
          - "laya"
