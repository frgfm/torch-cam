# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/demo"
    commit-message:
      prefix: "build(demo-image)"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "ci(github)"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "daily"
      time: "08:00"
    groups:
      docs:
        patterns:
          - "mkdocs*"
          - "griffe*"
      quality:
        patterns:
          - "ruff"
          - "ty"
          - "prek"
          - "uv-build"
      tests:
        patterns:
          - "pytest"
          - "pytest-cov"
          - "pytest-pretty"
      runtime:
        patterns:
          - "torch"
          - "torchvision"
          - "Pillow"
          - "numpy"
      demo:
        patterns:
          - "streamlit"
          - "transformers"
          - "laya"
  - package-ecosystem: "pip"
    directory: "/demo"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(demo-deps)"
    schedule:
      interval: "daily"
      time: "08:00"
    groups:
      demo:
        patterns:
          - "*"
