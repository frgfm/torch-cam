name: package

on:
  push:
    branches: main
    paths:
      - '.github/workflows/package.yml'
      - 'torchcam/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/package.yml'
      - 'torchcam/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
  release:
    types: [published]

env:
  UV_VERSION: "0.12.5"
  PYTHON_VERSION: "3.11"


jobs:
  install:
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
          enable-cache: false
      - name: Build the package
        run: make build
      - name: Install the engine
        shell: bash
        env:
          UV_TORCH_BACKEND: cpu
        run: uv pip install dist/*.whl
      - name: Check that we can import the engine
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "import torchcam; print(torchcam.__version__)"

  numpy-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        numpy: ['numpy==1.26.4', 'numpy>=2,<3']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
          enable-cache: false
      - name: Build the wheel
        run: uv build --wheel
      - name: Install with minimum PyTorch and Matplotlib and selected NumPy
        shell: bash
        env:
          UV_TORCH_BACKEND: cpu
          NUMPY_REQUIREMENT: ${{ matrix.numpy }}
        run: |
          for wheel in dist/*.whl; do
            uv pip install "${wheel}[test]" "torch==2.4.1" "torchvision==0.19.1" "matplotlib==3.8.4" "Pillow==9.3.0" "$NUMPY_REQUIREMENT"
          done
      - name: Test minimum supported dependencies
        shell: bash
        run: |
          # Tests import scripts.*; keep the source torchcam package off sys.path.
          cp -R scripts "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -c "import sys; from pathlib import Path; import torchcam; assert Path(torchcam.__file__).is_relative_to(sys.prefix), torchcam.__file__"
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib --no-cov

  code-quality:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
          enable-cache: false
      - name: Run quality checks
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make deps-check
          make install-quality
          ruff --version
          UV_NO_SYNC=1 make lint-check
          UV_NO_SYNC=1 make typing-check

  headers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the headers
        uses: frgfm/lint-my-headers@b2cbf9115943aa4b1407c3c944cc7c51250e7673 # v0.6.0

  test:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
          enable-cache: false
      - name: Check release version
        if: github.event_name == 'release'
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(uv version --short)"
          tag_version="$(uv version --dry-run --short -- "${RELEASE_TAG#v}")"
          if test "$tag_version" != "$package_version"; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Build and test distribution
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make build
          for wheel in dist/*.whl; do uv pip install "${wheel}[test]"; done
          # Tests import scripts.*; keep the source torchcam package off sys.path.
          cp -R scripts "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -c "import sys; from pathlib import Path; import torchcam; path = Path(torchcam.__file__); assert path.is_relative_to(sys.prefix), path; assert path.with_name('py.typed').is_file(); print(torchcam.__version__, path)"
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib --cov-report "xml:$GITHUB_WORKSPACE/coverage.xml"
          uv publish --dry-run --trusted-publishing never --token dry-run "$GITHUB_WORKSPACE"/dist/*
      - uses: actions/upload-artifact@v7
        with:
          path: ./coverage.xml
          name: coverage-reports
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'release'
        with:
          path: dist/
          name: release-distributions
          if-no-files-found: error

  codecov-upload:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage-reports
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          files: ./coverage.xml
          fail_ci_if_error: true

  publish:
    if: github.event_name == 'release'
    needs: [install, numpy-compatibility, code-quality, headers, test]
    runs-on: ubuntu-latest
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  verify-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    needs: [test, publish]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install package
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          uv pip install --system torchcam==${{ needs.test.outputs.package_version }}
          python -c "import torchcam; print(torchcam.__version__)"
