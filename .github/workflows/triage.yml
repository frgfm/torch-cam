name: triage

on:
  pull_request_target:
    branches: main

permissions:
  contents: read

jobs:
  autolabel:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
