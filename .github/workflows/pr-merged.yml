name: pr-merged

on:
  pull_request:
    branches: main
    types: closed

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.4"

permissions:
  contents: read

jobs:
  is-properly-labeled:
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install requests
        run: uv pip install --system requests
      - name: Process commit and find merger responsible for labeling
        id: commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          merger="$(python .github/verify_labels.py "$PR_NUMBER")"
          echo "merger=$merger" >> "$GITHUB_OUTPUT"
      - name: Comment PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: ${{ steps.commit.outputs.merger != '' }}
        env:
          PR_MERGER: ${{ steps.commit.outputs.merger }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { issue: { number: issue_number }, repo: { owner, repo }  } = context;
            const merger = process.env.PR_MERGER;
            await github.rest.issues.createComment({ issue_number, owner, repo, body: `Hey ${merger} 👋\nYou merged this PR, but it is not correctly labeled. The list of valid labels is available at https://github.com/frgfm/torch-cam/blob/main/.github/verify_labels.py` });
