name: demo

on:
  push:
    branches: main
    paths:
      - '.github/workflows/demo.yml'
      - 'demo/**'
      - 'pyproject.toml'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/demo.yml'
      - 'demo/**'
      - 'pyproject.toml'
      - 'Makefile'
  workflow_dispatch:  # Allow trusted manual runs from the Actions tab
    inputs:
      pretrained:
        description: Run model downloads with the separate read-only model token
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: demo-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.13.4"  # pinned for reproducible installs across all jobs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
      - name: Install dependencies
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make check-demo-lock
          uv build
          uv pip sync demo/requirements.txt
          uv pip install --no-deps dist/*.whl
          uv pip check
      - name: Run demo smoke check
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: uv run --no-sync python demo/smoke.py
      - name: Check pretrained models with read-only access
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.pretrained &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          HF_TOKEN: ${{ secrets.HF_MODEL_READ_TOKEN }}
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          if test -z "$HF_TOKEN"; then
            echo '::error::Configure HF_MODEL_READ_TOKEN with model-read access only; see .github/SECURITY.md.'
            exit 1
          fi
          uv run --no-sync python demo/smoke.py --pretrained
      - name: Start demo and wait for health
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/torchcam-demo.log"
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 STREAMLIT_BROWSER_GATHER_USAGE_STATS=false \
            STREAMLIT_SERVER_MAX_UPLOAD_SIZE=8 STREAMLIT_SERVER_MAX_MESSAGE_SIZE=10 \
            uv run --no-sync streamlit run demo/app.py --server.headless true --server.port 8080 \
            >"${log_file}" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          if ! python - <<'PY'
          import time
          from urllib.request import urlopen

          url = "http://127.0.0.1:8080/_stcore/health"
          deadline = time.monotonic() + 60
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except OSError as exc:
                  last_error = exc
              time.sleep(1)
          raise SystemExit(f"Streamlit health check timed out: {last_error}")
          PY
          then
            cat "${log_file}"
            exit 1
          fi

  sync-to-hub:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Sync demo to existing Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          space_dir="$(mktemp -d)"
          trap 'rm -rf "${space_dir}"' EXIT

          git clone --depth 1 https://huggingface.co/spaces/frgfm/torch-cam "${space_dir}"
          mkdir -p "${space_dir}/src"
          cp demo/app.py "${space_dir}/src/streamlit_app.py"
          cp demo/inference.py "${space_dir}/src/inference.py"
          cp demo/requirements.txt "${space_dir}/requirements.txt"
          printf 'torchcam[demo] @ git+https://github.com/%s.git@%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" >>"${space_dir}/requirements.txt"
          # Keep the Space-owned image and apply transport limits before Streamlit starts.
          sed -i '/^ENV STREAMLIT_SERVER_MAX_UPLOAD_SIZE=/d' "${space_dir}/Dockerfile"
          printf 'ENV STREAMLIT_SERVER_MAX_UPLOAD_SIZE=8 STREAMLIT_SERVER_MAX_MESSAGE_SIZE=10\n' >>"${space_dir}/Dockerfile"

          git -C "${space_dir}" config user.name "github-actions[bot]"
          git -C "${space_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${space_dir}" add Dockerfile requirements.txt src
          if git -C "${space_dir}" diff --cached --quiet; then
            echo "Space already matches ${GITHUB_SHA}."
            exit 0
          fi

          git -C "${space_dir}" commit -m "sync(demo): ${GITHUB_SHA::7}"
          askpass="${space_dir}/askpass.sh"
          cat >"${askpass}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' frgfm ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
          esac
          SH
          chmod 700 "${askpass}"
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${space_dir}" -c credential.helper= push origin HEAD:main
