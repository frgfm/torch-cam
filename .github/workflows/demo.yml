name: demo
on:
  push:
    branches: [codex/preview-pr-467]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the live UI with pretrained models
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "${RUNNER_TEMP}/torchcam-browser" playwright@1.57.0
          "${RUNNER_TEMP}/torchcam-browser/node_modules/.bin/playwright" install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          image = Path(os.environ['RUNNER_TEMP']) / 'border-collie.jpg'
          with urlopen(Request('https://www.woopets.fr/assets/races/000/066/big-portrait/border-collie.jpg', headers={'User-Agent': 'TorchCAM demo validation'}), timeout=60) as response:
              image.write_bytes(response.read())
          PY
          PLAYWRIGHT_PACKAGE="${RUNNER_TEMP}/torchcam-browser/node_modules/playwright" \
            DEMO_CHECK_IMAGE="${RUNNER_TEMP}/border-collie.jpg" node .github/live_demo_check.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-demo-screenshots
          path: live-demo-check/
          if-no-files-found: warn
