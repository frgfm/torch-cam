name: demo
on:
  push:
    branches: [codex/preview-pr-467]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Space configuration and runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          headers = {'Authorization': 'Bearer ' + os.environ['HF_TOKEN']}
          for url in (
              'https://huggingface.co/api/spaces/frgfm/torch-cam/runtime',
              'https://huggingface.co/api/spaces/frgfm/torch-cam',
              'https://huggingface.co/spaces/frgfm/torch-cam/raw/main/README.md',
          ):
              print('Inspect:', url, flush=True)
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  body = response.read().decode()
              if url.endswith('/torch-cam'):
                  info = json.loads(body)
                  body = json.dumps({key: info.get(key) for key in ('sha', 'runtime', 'cardData')})
              print(body, flush=True)
          PY
