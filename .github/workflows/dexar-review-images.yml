name: DEX-AR pretrained review images
on:
  push:
    branches: [tmp/dexar-review-images-20261010]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv pip install --system --torch-backend cpu -e . 'torch==2.14.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dexar-pretrained-review-examples
          run-id: '38045078089'
          github-token: ${{ github.token }}
          path: dexar-review-results
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dexar-original-logit-investigation
          run-id: '38045255592'
          github-token: ${{ github.token }}
          path: dexar-review-results
      - run: cp .github/dexar_review_annotations.json dexar-review-results/coco_annotations.json
      - run: python .github/dexar_render_review.py dexar-review-results
      - uses: actions/upload-artifact@v7
        with:
          name: dexar-pretrained-review-images
          path: dexar-review-results/
          retention-days: 30
