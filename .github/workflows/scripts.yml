name: scripts

on:
  pull_request:
    branches: main
    paths:
      - '.github/workflows/scripts.yml'
      - 'torchcam/**'
      - 'scripts/**'
      - 'tests/test_eval*.py'
      - 'tests/test_cam_example.py'
      - 'pyproject.toml'

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.12.5"


jobs:
  scripts:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cam-example
            command: python scripts/cam_example.py --arch resnet18 --weights none --img sample.png --noblock --method LayerCAM,RefineCAM --target layer3,layer4 --savefig cnn.png
          - name: cam-example-legrad
            command: python scripts/cam_example.py --arch vit_b_16 --weights none --img sample.png --noblock --method LeGrad --target encoder.layers.encoder_layer_11 --savefig vit.png
          - name: eval-latency
            command: |
              for method in CAM LayerCAM SmoothGradCAMpp ScoreCAM; do
                arch=resnet18
                if [ "$method" = ScoreCAM ]; then arch=mobilenet_v3_small; fi
                for scope in extractor end-to-end; do
                  python scripts/eval_latency.py "$method" --arch "$arch" --weights none --size 64 --it 3 --warmup 1 --repeat 1 --scope "$scope" --output "$method-$scope.json"
                done
              done
              python scripts/eval_latency.py RefineCAM --weights none --size 64 --target-layer layer3 --target-layer layer4 --it 3 --warmup 1 --repeat 1 --output refine.json
              python scripts/eval_latency.py GradCAM --arch swin_t --weights none --size 64 --target-layer features.7.1.norm2 --it 3 --warmup 1 --repeat 1 --output swin.json
              python scripts/eval_latency.py LeGrad --arch vit_b_16 --weights none --target-layer encoder.layers.encoder_layer_11 --it 3 --warmup 1 --repeat 1 --output legrad.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        env:
          UV_TORCH_BACKEND: cpu
        run: uv pip install --system --upgrade -e '.[scripts]'

      - name: Run analysis script
        env:
          MPLBACKEND: Agg
        run: |
          python -c "from PIL import Image; Image.new('RGB', (256, 256), 'red').save('sample.png')"
          ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-results
          path: |
            *.json
            cnn.png
            vit.png
          if-no-files-found: error
