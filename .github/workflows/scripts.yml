name: scripts

on:
  pull_request:
    paths:
      - '.github/workflows/scripts.yml'
      - 'torchcam/**'
      - 'scripts/**'
      - 'pyproject.toml'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.4"


jobs:
  scripts:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cam-example
            command: python scripts/cam_example.py --arch resnet18 --weights none --img sample.png --noblock --method LayerCAM,RefineCAM --target layer3,layer4 --savefig cnn.png
          - name: cam-example-legrad
            command: python scripts/cam_example.py --arch vit_b_16 --weights none --img sample.png --noblock --method LeGrad --target encoder.layers.encoder_layer_11 --savefig vit.png
          - name: eval-latency
            command: |
              python scripts/eval_latency.py LayerCAM --weights none --size 64 --it 3 --warmup 1 --repeat 2 --scope end-to-end --output latency.json
              python scripts/eval_latency.py ScoreCAM --arch mobilenet_v3_small --weights none --size 64 --it 1 --warmup 0 --repeat 1 --output score.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        env:
          UV_TORCH_BACKEND: cpu
        run: uv pip install --system --upgrade -e '.[scripts]'

      - name: Run analysis script
        env:
          MPLBACKEND: Agg
        run: |
          python -c "from PIL import Image; Image.new('RGB', (256, 256), 'red').save('sample.png')"
          ${{ matrix.command }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.name }}-results
          path: |
            *.json
            cnn.png
            vit.png
          if-no-files-found: error
